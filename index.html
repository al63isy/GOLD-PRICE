<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>أسعار الذهب - نواعم الحلي</title>
<link rel="stylesheet" href="https://unpkg.com/saudi-riyal-symbol@1.0.3/dist/saudi-riyal-symbol.css">
<style>
:root{--bg1:#262b3a;--bg2:#0e1019;--card:#171a23;--line:#3b3626;--gold:#d9b45a;--gold-soft:#f0dca0;--text:#f5f0e4;--muted:#9d978a;--up:#5fcf8a;--down:#ef7a70;--font-ar: Dubai,Cairo,"Segoe UI",Tahoma,sans-serif;--font-num:"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box;margin:0}html,body{min-height:100%}body{background:radial-gradient(ellipse at 50% 0,var(--bg1),var(--bg2) 75%);color:var(--text);font-family:var(--font-ar);display:flex;flex-direction:column;gap:2vh;padding:2.5vh 2.2vw;min-height:100vh}header{display:flex;align-items:center;justify-content:space-between;gap:2vw}.brand{font-size:max(3vh,2vw);font-weight:bold;color:var(--gold-soft)}.oz{direction:ltr;text-align:left}.oz small{display:block;color:var(--muted);font-size:max(1.6vh,1.1vw);letter-spacing:.15vw;text-transform:uppercase}.oz b{font-family:var(--font-num);font-size:max(7vh,4.2vw);line-height:1.05;background:linear-gradient(180deg,var(--gold-soft),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}.oz i{font-style:normal;font-size:max(3vh,2vw);margin-inline-start:.8vw}.up{color:var(--up)}.down{color:var(--down)}.gl{height:.35vh;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.8}main{flex:1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:2vw;min-height:65vh}.col{display:flex;flex-direction:column;gap:2vh;min-height:0}.card{flex:1;background:linear-gradient(180deg,#1c202b,var(--card));border:1px solid var(--line);border-radius:1.6vh;display:flex;flex-direction:column;overflow:hidden}.card h2{font-size:max(2.4vh,1.6vw);color:var(--gold-soft);padding:1.1vh 1.2vw;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#d9b45a1f,transparent)}.rows{flex:1;display:flex;flex-direction:column}.row{flex:1;display:flex;align-items:center;justify-content:space-between;padding:1vh 1.2vw;border-bottom:1px solid #ffffff0d;min-height:45px}.row:last-child{border:0}.k{display:flex;align-items:center;gap:.7vw;font-size:max(2.4vh,1.6vw)}.k b{min-width:3.2vw;text-align:center;font-family:var(--font-num);color:#14161d;background:linear-gradient(180deg,var(--gold-soft),var(--gold));border-radius:2vh;padding:.1vh .7vw;font-size:max(2.4vh,1.6vw)}.k span{color:var(--muted);font-size:max(1.7vh,1.15vw)}.v{direction:ltr;font-family:var(--font-num);font-weight:700;font-size:max(3.2vh,2.2vw);font-variant-numeric:tabular-nums}.v small{font-size:.5em;color:var(--muted);margin-inline-end:.4vw;font-weight:400}footer{display:flex;justify-content:space-between;gap:1em;color:var(--muted);font-size:max(1.5vh,1vw)}#st.err{color:var(--down)}.cur::before{content:"SAR"}body.sym .cur::before{content:"#";font-family:"Saudi Riyal Symbol";font-style:normal}body.sym .v small{font-size:.8em}
@media(max-aspect-ratio:1/1){main{grid-template-columns:1fr}.card{min-height:30vh}header .brand{font-size:5vw}.oz b{font-size:11vw}}
</style>
</head>
<body>
<header><div class="brand">نواعم الحلي</div><div class="oz"><small>Gold Price per Ounce</small><b id="oz">$----</b><i id="ar"></i></div></header>
<div class="gl"></div>
<main>
<div class="col"><div class="card"><h2>سعر الشاشة</h2><div class="rows" id="t-screen"></div></div><div class="card"><h2>سعر الشراء</h2><div class="rows" id="t-buy"></div></div></div>
<div class="col"><div class="card" style="flex:4"><h2>سعر البيع للجديد</h2><div class="rows" id="t-new"></div></div><div class="card" style="flex:2.2"><h2>سعر البيع للمستعمل</h2><div class="rows" id="t-used"></div></div></div>
<div class="col"><div class="card"><h2>سبائك عيار 24</h2><div class="rows" id="t-bars"></div></div></div>
</main>
<footer><span>آخر تحديث للسعر: <span id="st">...</span></span><span id="clock"></span></footer>
<script>
var CONFIG={usd:3.75,everyMinutes:3,karat:{22:.916,21:.875,18:.75},buyMinus:{24:10,22:10,21:10,18:20},new21Plus:80,new22Plus:15,newGharaish:-10,new18Plus:100,used21Plus:25,used18Plus:25,bars:[[1,30],[2.5,20],[5,20],[10,15],[20,10],[31.1,10],[50,10],[100,10]]};
var EVERY=CONFIG.everyMinutes*60000,prev=0,r=Math.round,money=function(n,dec){return '<small><span class="cur"></span></small>'+(dec?n.toFixed(2):r(n).toLocaleString('en-US'))};
function fill(id,rows){document.getElementById(id).innerHTML=rows.map(function(x){return '<div class="row"><div class="k"><b>'+x[0]+'</b>'+(x[2]?'<span>'+x[2]+'</span>':'')+'</div><div class="v">'+x[1]+'</div></div>'}).join('')}
function render(oz){var C=CONFIG,g=oz*C.usd/31.1,K=C.karat,B=C.buyMinus,s24=g,s22=g*K[22],s21=g*K[21],s18=g*K[18],b24=s24-B[24],b22=s22-B[22],b21=s21-B[21],b18=s18-B[18],n21=s21+C.new21Plus,n22=n21+C.new22Plus,ng=n21+C.newGharaish,n18=s18+C.new18Plus,u21=s21+C.used21Plus,u18=s18+C.used18Plus;fill('t-screen',[[24,money(s24,1)],[22,money(s22,1)],[21,money(s21,1)],[18,money(s18,1)]]);fill('t-buy',[[24,money(b24)],[22,money(b22)],[21,money(b21)],[18,money(b18)]]);fill('t-new',[[22,money(n22)],[21,money(n21)],[21,money(ng),'الغوايش'],[18,money(n18)]]);fill('t-used',[[21,money(u21)],[18,money(u18)]]);fill('t-bars',C.bars.map(function(w){return [w[0]+'g',money((s24+w[1])*w[0])] }));document.getElementById('oz').textContent='$'+oz.toLocaleString('en-US',{minimumFractionDigits:2});var a=document.getElementById('ar');if(prev&&oz!==prev){a.textContent=oz>prev?'▲':'▼';a.className=oz>prev?'up':'down'}prev=oz}
function stamp(ok){var e=document.getElementById('st');e.className=ok?'':'err';e.textContent=new Date().toLocaleTimeString('en-GB')+(ok?'':' (تعذر التحديث - يعرض آخر سعر)')}
function get(u,pick){return fetch(u,{cache:'no-store'}).then(function(x){if(!x.ok)throw Error('Network response');return x.json()}).then(pick)}
function load(){var Y='https://query1.finance.yahoo.com/v8/finance/chart/GC=F',py=function(j){return j.chart.result[0].meta.regularMarketPrice};get(Y,py).catch(function(){return get('https://api.allorigins.win/raw?url='+encodeURIComponent(Y),py)}).catch(function(){return get('https://corsproxy.io/?'+encodeURIComponent(Y),py)}).catch(function(){return get('https://api.gold-api.com/price/XAU',function(j){return j.price})}).then(function(p){if(!(p>0))throw 0;render(p);stamp(true);try{localStorage.setItem('oz',p)}catch(e){}}).catch(function(){var p=0;try{p=parseFloat(localStorage.getItem('oz'))}catch(e){}if(p>0){render(p);stamp(false)}else{stamp(false);document.getElementById('st').textContent='تعذر جلب السعر - تحقق من اتصال الإنترنت'}})}
function tick(){document.getElementById('clock').textContent=new Date().toLocaleString('ar-SA',{dateStyle:'full',timeStyle:'short'})}
document.addEventListener('click',function(){var d=document.documentElement;if(!document.fullscreenElement&&d.requestFullscreen)d.requestFullscreen().catch(function(){});if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(function(){})});try{document.fonts.load("16px 'Saudi Riyal Symbol'",'#').then(function(f){if(f&&f.length)document.body.classList.add('sym')}).catch(function(){})}catch(e){}tick();setInterval(tick,30000);load();setInterval(load,EVER);
</script>
</body>
</html>
